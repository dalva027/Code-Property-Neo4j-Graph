services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/codegraph
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p codegraph 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .                    # the image also compiles extractor/
      dockerfile: backend/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: codegraph
      REPOS_ROOT: /repos
      CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend/app:/app/app      # hot reload
      - ./repos:/repos:ro           # repositories to analyze
      - advisory_db:/var/lib/codegraph   # RustSec advisory-db checkout, refreshed daily
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src     # hot reload
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  neo4j_data:
  advisory_db:
