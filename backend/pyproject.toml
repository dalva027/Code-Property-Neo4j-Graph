[project]
name = "codegraph-api"
version = "0.1.0"
description = "Code review / static analysis API backed by a Neo4j code graph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tree-sitter>=0.23",
    "tree-sitter-rust>=0.23",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "testcontainers[neo4j]>=4.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/*.cypher", "rules/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["extractor: runs in whichever code-facts mode the environment configures (see tests/conftest.py)"]

[tool.ruff]
line-length = 100
