# Where tainted data does damage, keyed by rule id (see docs/build-plan.md section 3).
# `args` are the 0-based argument positions that matter, receiver excluded; without `args` any
# argument counts. `template` restricts a format-like macro to format strings that match it.
sinks:
  T1:   # command injection, CWE-78
    - {path: "std::process::Command::new", args: [0]}
    - {path: "std::process::Command::{arg,args}", args: [0]}
    - {path: "tokio::process::Command::new", args: [0]}
    - {path: "tokio::process::Command::{arg,args}", args: [0]}
  T2:   # SQL injection, CWE-89; the compile-checked sqlx::query! macros are not sinks
    - {path: "sqlx::{query,query_as,query_scalar,raw_sql}", args: [0]}
    - {path: "diesel::sql_query", args: [0]}
    - {path: "rusqlite::Connection::{execute,prepare,query_row,execute_batch}", args: [0]}
    - {path: "tokio_postgres::Client::{query,execute,simple_query,batch_execute}", args: [0]}
  T3:   # path traversal, CWE-22. Path::join and PathBuf::push are not sinks: taint flows through them
    - {path: "std::fs::{read,read_to_string,read_dir,write,remove_file,remove_dir,remove_dir_all,create_dir,create_dir_all,copy,rename,metadata}", args: [0]}
    - {path: "std::fs::File::{open,create}", args: [0]}
    - {path: "std::fs::OpenOptions::open", args: [0]}
    - {path: "tokio::fs::*", args: [0]}
    - {path: "tokio::fs::File::{open,create}", args: [0]}
  T4:   # SSRF, CWE-918
    - {path: "reqwest::get", args: [0]}
    - {path: "reqwest::Client::{get,post,put,patch,delete,head}", args: [0]}
    - {path: "reqwest::Client::request", args: [1]}
    - {path: "reqwest::blocking::get", args: [0]}
    - {path: "reqwest::blocking::Client::{get,post,put,patch,delete,head}", args: [0]}
    - {path: "reqwest::blocking::Client::request", args: [1]}
    - {path: "ureq::{get,post,put,patch,delete,head}", args: [0]}
    - {path: "ureq::request", args: [1]}
    - {path: "std::net::TcpStream::connect", args: [0]}
    - {path: "tokio::net::TcpStream::connect", args: [0]}
  T5:   # length or index from input reaching unsafe memory APIs, CWE-119
    - {path: "std::slice::{from_raw_parts,from_raw_parts_mut}", args: [1]}
    - {path: "std::vec::Vec::set_len", args: [0]}
    - {path: "std::vec::Vec::from_raw_parts", args: [1, 2]}
    - {path: "std::ptr::{copy,copy_nonoverlapping}", args: [2]}
    - {path: "std::ptr::write_bytes", args: [2]}
    - {path: "std::alloc::Layout::from_size_align", args: [0]}
    - {path: "std::alloc::Layout::from_size_align_unchecked", args: [0]}
    - {path: "?::{get_unchecked,get_unchecked_mut}", args: [0]}
  T6:   # open redirect, CWE-601
    - {path: "axum::response::Redirect::{to,permanent,temporary}", args: [0]}
    - {path: "actix_web::web::Redirect::to", args: [0]}
    - {path: "rocket::response::Redirect::{to,temporary,permanent,found}", args: [0]}
    - {path: "std::{write,writeln}!", template: "(?i)location:", note: "a hand-written Location header"}
    # A Location header set by name: `.header(header::LOCATION, target)`, `headers.insert(LOCATION, v)`
    - {path: "http::response::Builder::header", args: [1], when: {0: "(?i)location"}}
    - {path: "http::HeaderMap::{insert,append}", args: [1], when: {0: "(?i)location"}}
    - {path: "actix_web::HttpResponseBuilder::{insert_header,append_header}", args: [0], when: {0: "(?i)location"}}
  T7:   # header injection / response splitting, CWE-113. HeaderValue::from_str and from_bytes reject
        # CR and LF, so they are sanitizers; only the unchecked constructor and hand-written
        # header serialization can be injected into.
    - {path: "http::HeaderValue::from_maybe_shared_unchecked", args: [0]}
    - {path: "http::HeaderName::from_bytes", args: [0], note: "header name chosen by the client"}
    # A header line assembled by hand: `"Name: {value}\r\n"` in one format string, or the
    # `"{name}: "` that starts one when the value and the line end are written separately.
    - {path: "std::{write,writeln}!", template: '(?is)^(?!.*location:).*([\w}]:\s*\{[^}]*\}.*\\r\\n|\{[^}]*\}:\s*"$)', note: "a hand-written header line"}
  P3:   # integer overflow, CWE-190: the operands of an integer `+ - * <<` (rule-internal sink, listed for reference)
    - {path: "ops::arith"}
  P4:   # unbounded allocation from input, CWE-770. vec![x; n] and read_to_end are not covered.
    - {path: "std::vec::Vec::with_capacity", args: [0]}
    - {path: "std::string::String::with_capacity", args: [0]}
    - {path: "std::collections::{HashMap,HashSet,VecDeque,BinaryHeap}::with_capacity", args: [0]}
    - {path: "?::{reserve,reserve_exact,resize}", args: [0]}
    - {path: "std::iter::repeat_n", args: [1]}
