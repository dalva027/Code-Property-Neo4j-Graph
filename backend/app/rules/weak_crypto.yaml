# Cryptography misuse patterns for rules C1, C2, C3, C5, C6, C7.
weak_crypto:
  weak_hash:            # C1, CWE-327/328
    - {path: "md5", kind: crate}
    - {path: "sha1", kind: crate}
    - {path: "sha1_smol", kind: crate}
    - {path: "openssl::hash::MessageDigest::{md5,sha1}"}
    - {path: "ring::digest::SHA1_FOR_LEGACY_USE_ONLY", kind: type}
  insecure_rng:         # C3, CWE-338; thread_rng, OsRng and getrandom are fine
    - {path: "rand::rngs::{SmallRng,mock::StepRng}", kind: type}
    - {path: "rand::rngs::{SmallRng,mock::StepRng}::*", note: "any constructor of a non-cryptographic RNG"}
    - {path: "rand::rngs::StdRng::{seed_from_u64,from_seed}", args: [0], note: "with a constant seed"}
    - {path: "?::{seed_from_u64,from_seed}", args: [0], note: "with a constant seed"}
    - {path: "fastrand", kind: crate}
    - {path: "oorandom", kind: crate}
  tls_disabled:         # C5, CWE-295
    - {path: "?::{danger_accept_invalid_certs,danger_accept_invalid_hostnames}", args: [0], note: "with argument true"}
    - {path: "openssl::ssl::SslVerifyMode::NONE", kind: type}
    - {path: "?::dangerous", note: "rustls ClientConfig::dangerous()"}
    - {path: "rustls::client::danger::ServerCertVerifier", kind: type, note: "a custom verifier; check it verifies"}
    - {path: "rustls::client::ServerCertVerifier", kind: type}
  insecure_cipher:      # C6, CWE-327
    - {path: "des", kind: crate}
    - {path: "rc2", kind: crate}
    - {path: "rc4", kind: crate}
    - {path: "blowfish", kind: crate}
    - {path: "ecb", kind: crate}
    - {path: "openssl::symm::Cipher::{des_cbc,des_ecb,des_ede3,des_ede3_cbc,rc4,aes_128_ecb,aes_192_ecb,aes_256_ecb,bf_cbc,bf_ecb}"}
  weak_kdf:             # C7, CWE-916; `min` gives the smallest acceptable literal per argument (OWASP 2023)
    - {path: "pbkdf2::{pbkdf2,pbkdf2_hmac,pbkdf2_hmac_array}", args: [2], min: {2: 100000}, note: "rounds"}
    - {path: "openssl::pkcs5::pbkdf2_hmac", args: [2], min: {2: 100000}}
    - {path: "ring::pbkdf2::derive", args: [1], min: {1: 100000}}
    - {path: "argon2::Params::new", args: [0, 1], min: {0: 19456, 1: 2}, note: "m_cost KiB, t_cost"}
    - {path: "scrypt::Params::new", args: [0], min: {0: 15}, note: "log_n"}
    - {path: "bcrypt::{hash,hash_with_salt}", args: [1], min: {1: 10}, note: "cost"}
  fast_hash:            # C2, CWE-916: general-purpose digests, wrong for passwords however strong
    - {path: "md5", kind: crate}
    - {path: "sha1", kind: crate}
    - {path: "sha2", kind: crate}
    - {path: "sha3", kind: crate}
    - {path: "blake2", kind: crate}
    - {path: "blake3", kind: crate}
    - {path: "digest::Digest::{digest,update,chain_update,new_with_prefix}"}
    - {path: "ring::digest::digest", args: [1]}
    - {path: "openssl::hash::hash", args: [1]}
    - {path: "openssl::sha::{sha1,sha256,sha512}", args: [0]}
  nonce:                # C6, CWE-323: a nonce built from a constant
    - {path: "aes_gcm::Nonce::from_slice", args: [0]}
    - {path: "chacha20poly1305::{Nonce,XNonce}::from_slice", args: [0]}
    - {path: "aes_gcm_siv::Nonce::from_slice", args: [0]}
    - {path: "*::Nonce::from_slice", args: [0]}
    - {path: "ring::aead::Nonce::assume_unique_for_key", args: [0]}
