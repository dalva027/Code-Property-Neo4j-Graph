# Hard-coded secrets (rule C4). Values are never stored: findings keep a redacted preview and a hash.
secrets:
  # A string literal bound to a binding, field or const whose name matches one of these (case-insensitive).
  identifiers:
    - "(?i)(api|access|auth|secret|private)[_-]?key"
    - "(?i)(client|app)[_-]?secret"
    - "(?i)passw(or)?d|passwd|pwd"
    - "(?i)(auth|bearer|access|refresh|session)[_-]?token"
    - "(?i)credentials?"
  # Literal formats that are secrets wherever they appear.
  formats:
    aws_access_key_id: "\\b(AKIA|ASIA)[0-9A-Z]{16}\\b"
    github_token: "\\bgh[pousr]_[A-Za-z0-9]{36,}\\b"
    slack_token: "\\bxox[abprs]-[A-Za-z0-9-]{10,}\\b"
    private_key_pem: "-----BEGIN ((RSA|EC|DSA|OPENSSH) )?PRIVATE KEY-----"
    jwt: "\\beyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\b"
  # High-entropy literals count only next to a secret-like identifier.
  min_entropy: 3.5
  min_length: 16
