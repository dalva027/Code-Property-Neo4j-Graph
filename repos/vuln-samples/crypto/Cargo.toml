[package]
name = "crypto-sample"
version = "0.1.0"
edition = "2021"
publish = false

# Declared so the sample reads like real code; the crate is parsed, not built.
[dependencies]
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
fastrand = "2"
reqwest = { version = "0.12", features = ["blocking"] }
openssl = "0.10"
