[package]
name = "codegraph-extract"
version = "0.1.0"
edition = "2021"
description = "Extracts dependency and advisory facts from a Cargo workspace for codegraph"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
rustsec = { version = "0.33", features = ["git"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
